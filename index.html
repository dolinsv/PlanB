    <meta http-equiv="Pragma" content="no-cache" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem('planb_theme') || 'auto';
          var dark =
            t === 'dark' ||
            (t !== 'light' &&
              window.matchMedia &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.setAttribute(
            'data-theme',
            dark ? 'dark' : 'light'
          );
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
          var meta = document.getElementById('cp-theme-color');
          if (meta) meta.setAttribute('content', dark ? '#1c1f23' : '#0e7490');
        } catch (e) {}
      })();
    </script>
